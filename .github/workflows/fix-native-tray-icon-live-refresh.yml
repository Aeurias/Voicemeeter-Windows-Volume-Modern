name: Fix native tray icon live refresh

on:
  pull_request:
    branches:
      - perf/native-low-memory-host

permissions:
  contents: write

jobs:
  fix-build-squash:
    runs-on: windows-latest
    steps:
      - name: Check out permanent branch
        uses: actions/checkout@v4
        with:
          ref: perf/native-low-memory-host
          fetch-depth: 0

      - name: Apply and assert tray icon refresh logic
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("native/VMWV.NativeHost/src/main.cpp")
          text = path.read_text(encoding="utf-8")

          old_maintenance = '''        case kMaintenanceTimer:
              if (settingsStore_.ReloadIfChanged(settings_))
              {
                  SyncCurrentAudio();
              }
              TryConnectVoicemeeter(false);
              break;
          '''
          new_maintenance = '''        case kMaintenanceTimer:
              {
                  const std::string previousLogoVariant = settings_.logoVariant;
                  if (settingsStore_.ReloadIfChanged(settings_))
                  {
                      if (settings_.logoVariant != previousLogoVariant)
                      {
                          RefreshTrayIcon();
                      }
                      SyncCurrentAudio();
                  }
                  TryConnectVoicemeeter(false);
                  break;
              }
          '''
          if old_maintenance not in text:
              raise SystemExit("Maintenance timer block did not match expected source")
          text = text.replace(old_maintenance, new_maintenance, 1)

          add_marker = '''    void AddTrayIcon()
              {
          '''
          helper = '''    HICON LoadTrayIcon()
              {
                  const wchar_t* fileName = L"logo.ico";
                  if (settings_.logoVariant == "Black")
                  {
                      fileName = L"logo-black.ico";
                  }
                  else if (settings_.logoVariant == "White")
                  {
                      fileName = L"logo-white.ico";
                  }

                  const std::filesystem::path iconPath =
                      std::filesystem::path(ExecutableDirectory()) / L"Assets" / L"Brand" / fileName;
                  const HICON loaded = reinterpret_cast<HICON>(LoadImageW(
                      nullptr,
                      iconPath.c_str(),
                      IMAGE_ICON,
                      0,
                      0,
                      LR_LOADFROMFILE | LR_DEFAULTSIZE));
                  if (loaded != nullptr)
                  {
                      ownsTrayIconHandle_ = true;
                      return loaded;
                  }

                  ownsTrayIconHandle_ = false;
                  return icon_;
              }

              void ReleaseTrayIconHandle()
              {
                  if (ownsTrayIconHandle_ && trayIconHandle_ != nullptr)
                  {
                      DestroyIcon(trayIconHandle_);
                  }
                  trayIconHandle_ = nullptr;
                  ownsTrayIconHandle_ = false;
              }

              void RefreshTrayIcon()
              {
                  if (!trayVisible_)
                  {
                      return;
                  }
                  RemoveTrayIcon();
                  AddTrayIcon();
                  UpdateTrayTooltip();
              }

          '''
          if "HICON LoadTrayIcon()" not in text:
              if add_marker not in text:
                  raise SystemExit("AddTrayIcon marker did not match expected source")
              text = text.replace(add_marker, helper + add_marker, 1)

          add_start = text.index(add_marker)
          remove_marker = "\n    void RemoveTrayIcon()"
          add_end = text.index(remove_marker, add_start)
          add_block = text[add_start:add_end]
          if "trayIcon_.hIcon = icon_;" not in add_block:
              raise SystemExit("Expected fixed-colour tray icon assignment was not found")
          add_block = add_block.replace(
              "        trayIcon_ = {};",
              "        ReleaseTrayIconHandle();\n        trayIconHandle_ = LoadTrayIcon();\n        trayIcon_ = {};",
              1)
          add_block = add_block.replace("trayIcon_.hIcon = icon_;", "trayIcon_.hIcon = trayIconHandle_;", 1)
          old_success = '''        if (trayVisible_)
              {
                  trayIcon_.uVersion = NOTIFYICON_VERSION_4;
                  Shell_NotifyIconW(NIM_SETVERSION, &trayIcon_);
              }
          '''
          new_success = '''        if (trayVisible_)
              {
                  trayIcon_.uVersion = NOTIFYICON_VERSION_4;
                  Shell_NotifyIconW(NIM_SETVERSION, &trayIcon_);
              }
              else
              {
                  ReleaseTrayIconHandle();
              }
          '''
          if old_success not in add_block:
              raise SystemExit("Tray icon success block did not match expected source")
          add_block = add_block.replace(old_success, new_success, 1)
          text = text[:add_start] + add_block + text[add_end:]

          old_remove = '''    void RemoveTrayIcon()
              {
                  if (!trayVisible_)
                  {
                      return;
                  }
                  Shell_NotifyIconW(NIM_DELETE, &trayIcon_);
                  trayVisible_ = false;
              }
          '''
          new_remove = '''    void RemoveTrayIcon()
              {
                  if (trayVisible_)
                  {
                      Shell_NotifyIconW(NIM_DELETE, &trayIcon_);
                      trayVisible_ = false;
                  }
                  ReleaseTrayIconHandle();
              }
          '''
          if old_remove not in text:
              raise SystemExit("RemoveTrayIcon block did not match expected source")
          text = text.replace(old_remove, new_remove, 1)

          required = [
              "const std::string previousLogoVariant = settings_.logoVariant;",
              "RefreshTrayIcon();",
              "HICON LoadTrayIcon()",
              'fileName = L"logo-black.ico";',
              'fileName = L"logo-white.ico";',
              "trayIcon_.hIcon = trayIconHandle_;",
              "ReleaseTrayIconHandle();",
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f"Required source text is missing: {value}")
          if "trayIcon_.hIcon = icon_;" in text:
              raise SystemExit("Old fixed-colour tray icon assignment is still present")

          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

          git diff --check
          git grep -n "previousLogoVariant\|HICON LoadTrayIcon\|trayIcon_.hIcon = trayIconHandle_" -- native/VMWV.NativeHost/src/main.cpp

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/VMWV.NativeHost/src/main.cpp
          git commit -m "Apply icon variants to the native tray host"
          git push origin HEAD:perf/native-low-memory-host

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/Create-ReleaseArtifacts.ps1 -Platform x64

      - name: Verify release payload and host startup
        shell: pwsh
        run: |
          foreach ($name in @('logo.ico', 'logo-black.ico', 'logo-white.ico')) {
            if (-not (Get-ChildItem artifacts -Recurse -File -Filter $name | Select-Object -First 1)) {
              throw "$name was not included in the release payload"
            }
          }
          $hostExe = Get-ChildItem artifacts -Recurse -File -Filter VMWV.NativeHost.exe | Select-Object -First 1
          if (-not $hostExe) { throw "VMWV.NativeHost.exe was not produced" }
          $process = Start-Process $hostExe.FullName -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Native host exited during startup probe with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Upload corrected installer
        uses: actions/upload-artifact@v4
        with:
          name: VMWV-native-low-memory-installer-x64-tray-icon-fixed
          path: artifacts/release/VoicemeeterWindowsVolumeModern-Setup-x64.msi
          if-no-files-found: error

      - name: Squash and verify permanent branch
        shell: pwsh
        run: |
          git fetch origin perf/stop-audio-endpoint-refresh-churn
          $base = git rev-parse origin/perf/stop-audio-endpoint-refresh-churn
          $tree = git rev-parse 'HEAD^{tree}'
          $commit = git commit-tree $tree -p $base -m "Move background sync to a low-memory native host"
          git push --force origin "$commit`:refs/heads/perf/native-low-memory-host"
          git fetch --force origin perf/native-low-memory-host:refs/remotes/origin/perf/native-low-memory-host
          $remoteSource = git show origin/perf/native-low-memory-host:native/VMWV.NativeHost/src/main.cpp
          foreach ($required in @(
            'const std::string previousLogoVariant = settings_.logoVariant;',
            'HICON LoadTrayIcon()',
            'trayIcon_.hIcon = trayIconHandle_;'
          )) {
            if (-not ($remoteSource | Select-String -SimpleMatch $required -Quiet)) {
              throw "Remote branch is missing required source: $required"
            }
          }

      - name: Delete temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh api --method DELETE repos/Aeurias/Voicemeeter-Windows-Volume-Modern/git/refs/heads/perf/tray-icon-live-refresh-build
