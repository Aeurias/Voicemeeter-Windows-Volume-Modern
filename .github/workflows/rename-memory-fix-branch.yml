name: Rename memory-fix branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  rename:
    if: github.head_ref == 'perf/rename-memory-fix-branch'
    runs-on: ubuntu-latest
    steps:
      - name: Rename branch and clean up
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const oldName = 'agent/stop-audio-endpoint-refresh-churn';
            const newName = 'perf/stop-audio-endpoint-refresh-churn';

            await github.request('POST /repos/{owner}/{repo}/branches/{branch}/rename', {
              owner,
              repo,
              branch: oldName,
              new_name: newName,
            });

            for (let attempt = 0; attempt < 12; attempt += 1) {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch: newName });
                break;
              } catch (error) {
                if (attempt === 11) throw error;
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: context.issue.number,
              state: 'closed',
            });

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: 'heads/perf/rename-memory-fix-branch',
            });
