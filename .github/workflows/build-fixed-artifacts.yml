name: Build fixed artifacts

on:
  pull_request:
    branches:
      - agent/stop-audio-endpoint-refresh-churn
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build portable EXE and MSI
        shell: pwsh
        run: ./scripts/Create-ReleaseArtifacts.ps1 -Platform x64

      - name: Upload fixed builds
        uses: actions/upload-artifact@v4
        with:
          name: Voicemeeter-Windows-Volume-Modern-fixed-x64
          path: |
            artifacts/release/VoicemeeterWindowsVolumeModern-Portable-x64.exe
            artifacts/release/VoicemeeterWindowsVolumeModern-Setup-x64.msi
          if-no-files-found: error
          retention-days: 7
