name: Clean up tray icon validation branch

on:
  push:
    branches:
      - perf/tray-icon-variant-build

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/Aeurias/Voicemeeter-Windows-Volume-Modern/git/refs/heads/perf/tray-icon-variant-build
