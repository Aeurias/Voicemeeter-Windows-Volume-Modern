name: Native low-memory host

on:
  pull_request:
    branches:
      - agent/stop-audio-endpoint-refresh-churn

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure native host
        shell: pwsh
        run: cmake -S native/VMWV.NativeHost -B artifacts/native-host -A x64

      - name: Build native host
        shell: pwsh
        run: cmake --build artifacts/native-host --config Release

      - name: Run native self-test
        shell: pwsh
        run: artifacts/native-host/Release/VMWV.NativeHost.exe --self-test

      - name: Probe idle memory when available
        shell: pwsh
        run: |
          $hostPath = Resolve-Path artifacts/native-host/Release/VMWV.NativeHost.exe
          $process = Start-Process -FilePath $hostPath -ArgumentList '--background' -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              Write-Warning "Operational memory probe unavailable on the hosted runner (exit code $($process.ExitCode)); it has no normal desktop audio/Voicemeeter environment."
              "### Native host idle memory" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "Hosted-runner measurement unavailable; test the bundle on a normal Windows system with Voicemeeter." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              exit 0
            }

            $process.Refresh()
            $workingSetMb = [Math]::Round($process.WorkingSet64 / 1MB, 2)
            $privateMb = [Math]::Round($process.PrivateMemorySize64 / 1MB, 2)
            "### Native host idle memory" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "- Working set: **$workingSetMb MB**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "- Private bytes: **$privateMb MB**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host "Working set: $workingSetMb MB"
            Write-Host "Private bytes: $privateMb MB"
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Build managed projects
        shell: pwsh
        run: |
          dotnet build native/VMWV.Core/VMWV.Core.csproj -c Release
          dotnet build native/VMWV.Infrastructure.Windows/VMWV.Infrastructure.Windows.csproj -c Release
          dotnet build native/VMWV.App/VMWV.App.csproj -c Release -p:Platform=x64

      - name: Create release artifacts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Create-ReleaseArtifacts.ps1 -Platform x64

      - name: Verify installer contents
        shell: pwsh
        run: |
          $msi = 'artifacts/release/VoicemeeterWindowsVolumeModern-Setup-x64.msi'
          $hostExe = 'artifacts/release/publish-win-x64/VMWV.NativeHost.exe'
          $settingsExe = 'artifacts/release/publish-win-x64/VMWV.App.exe'
          foreach ($path in @($msi, $hostExe, $settingsExe)) {
            if (-not (Test-Path $path)) {
              throw "Expected release output missing: $path"
            }
          }
          Get-Item $msi, $hostExe, $settingsExe | Select-Object Name, Length

      - name: Upload x64 test bundle
        uses: actions/upload-artifact@v4
        with:
          name: VMWV-native-low-memory-x64
          path: artifacts/release/publish-win-x64
          compression-level: 0
          retention-days: 7

      - name: Upload x64 MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: VMWV-native-low-memory-installer-x64
          path: artifacts/release/VoicemeeterWindowsVolumeModern-Setup-x64.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  finalize-clean-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out implementation source
        uses: actions/checkout@v4
        with:
          ref: agent/export-source-for-native-host
          fetch-depth: 0

      - name: Build one clean commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin agent/stop-audio-endpoint-refresh-churn
          rm -f .github/workflows/native-low-memory-host.yml
          rm -f .github/workflows/finalize-native-host-pr.yml
          rm -rf .automation

          git reset --soft origin/agent/stop-audio-endpoint-refresh-churn
          git add -A
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move background sync to a low-memory native host"
          git push --force origin HEAD:perf/native-low-memory-host

      - name: Open clean draft PR and close temporary PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:perf/native-low-memory-host`;
            const base = 'agent/stop-audio-endpoint-refresh-churn';
            const title = 'Move background sync to a low-memory native host';
            const body = `## What changed

- Adds a small C++20 Win32 tray process for the always-running synchronization work.
- Uses Core Audio COM callbacks directly instead of keeping .NET, WinUI, Windows App SDK and NAudio loaded in the background.
- Calls the Voicemeeter Remote API directly from the native host.
- Opens the existing WinUI application only for settings and diagnostics.
- Exits the settings process when its window closes, leaving only the native host running.
- Updates startup registration, portable launching, installer shortcuts and release packaging to start the native host.

## Compatibility

The native host keeps using the existing settings file at \`%LOCALAPPDATA%\\Voicemeeter Windows Volume\\settings.json\` and preserves the current bindings and synchronization options.

## Validation

- Native host builds successfully with MSVC.
- Native self-tests pass.
- Managed projects build successfully.
- The combined x64 bundle and MSI installer build successfully.

This remains a draft until synchronization behaviour and idle memory have been tested on a normal Windows machine with Voicemeeter running.`;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base,
              per_page: 10,
            });

            let pull;
            if (existing.data.length > 0) {
              pull = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                title,
                body,
                state: 'open',
              });
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                head: 'perf/native-low-memory-host',
                base,
                title,
                body,
                draft: true,
              });
              pull = created.data;
            }

            await github.rest.pulls.update({ owner, repo, pull_number: 5, state: 'closed' });
            core.summary.addHeading('Clean native-host PR').addLink(`#${pull.number}`, pull.html_url).write();
