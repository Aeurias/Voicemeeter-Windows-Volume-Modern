name: Native low-memory host

on:
  push:
    branches:
      - perf/native-low-memory-host
  pull_request:
    branches:
      - agent/stop-audio-endpoint-refresh-churn

permissions:
  contents: write

jobs:
  build-and-measure:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Initialize diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          "run_id=$env:GITHUB_RUN_ID" | Set-Content artifacts/ci-result.txt
          "sha=$env:GITHUB_SHA" | Add-Content artifacts/ci-result.txt
          "event=$env:GITHUB_EVENT_NAME" | Add-Content artifacts/ci-result.txt

      - name: Configure native host
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          & cmake -S native/VMWV.NativeHost -B artifacts/native-host -A x64 *>&1 |
            Tee-Object artifacts/native-configure.log
          exit $LASTEXITCODE

      - name: Build native host
        id: native_build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & cmake --build artifacts/native-host --config Release *>&1 |
            Tee-Object artifacts/native-build.log
          exit $LASTEXITCODE

      - name: Run native self-test
        id: self_test
        if: steps.native_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & artifacts/native-host/Release/VMWV.NativeHost.exe --self-test *>&1 |
            Tee-Object artifacts/native-self-test.log
          exit $LASTEXITCODE

      - name: Measure idle memory
        id: memory
        if: steps.native_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $hostPath = Resolve-Path artifacts/native-host/Release/VMWV.NativeHost.exe
          $process = Start-Process -FilePath $hostPath -ArgumentList '--background' -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              throw "Native host exited before memory could be measured (exit code $($process.ExitCode))."
            }

            $process.Refresh()
            $workingSetMb = [Math]::Round($process.WorkingSet64 / 1MB, 2)
            $privateMb = [Math]::Round($process.PrivateMemorySize64 / 1MB, 2)
            "working_set_mb=$workingSetMb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "private_mb=$privateMb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "Working set: $workingSetMb MB" | Tee-Object artifacts/native-memory.log
            "Private bytes: $privateMb MB" | Tee-Object artifacts/native-memory.log -Append
            if ($privateMb -gt 20) {
              throw "Native host private memory exceeded the 20 MB regression ceiling."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Build managed projects
        id: managed_build
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = $false
          & dotnet build native/VMWV.Core/VMWV.Core.csproj -c Release *>&1 |
            Tee-Object artifacts/core-build.log
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          & dotnet build native/VMWV.Infrastructure.Windows/VMWV.Infrastructure.Windows.csproj -c Release *>&1 |
            Tee-Object artifacts/infrastructure-build.log
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          & dotnet build native/VMWV.App/VMWV.App.csproj -c Release -p:Platform=x64 *>&1 |
            Tee-Object artifacts/app-build.log
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          if ($failed) { exit 1 }

      - name: Publish test bundle
        id: publish
        if: steps.native_build.outcome == 'success' && steps.managed_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & dotnet publish native/VMWV.App/VMWV.App.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o artifacts/test-bundle *>&1 |
              Tee-Object artifacts/publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/native-host/Release/VMWV.NativeHost.exe artifacts/test-bundle/VMWV.NativeHost.exe

      - name: Upload test bundle
        if: steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VMWV-native-low-memory-x64
          path: artifacts/test-bundle
          compression-level: 0
          retention-days: 7

      - name: Assemble CI result
        if: always()
        shell: pwsh
        run: |
          "configure=${{ steps.configure.outcome }}" | Add-Content artifacts/ci-result.txt
          "native_build=${{ steps.native_build.outcome }}" | Add-Content artifacts/ci-result.txt
          "self_test=${{ steps.self_test.outcome }}" | Add-Content artifacts/ci-result.txt
          "memory=${{ steps.memory.outcome }}" | Add-Content artifacts/ci-result.txt
          "working_set_mb=${{ steps.memory.outputs.working_set_mb }}" | Add-Content artifacts/ci-result.txt
          "private_mb=${{ steps.memory.outputs.private_mb }}" | Add-Content artifacts/ci-result.txt
          "managed_build=${{ steps.managed_build.outcome }}" | Add-Content artifacts/ci-result.txt
          "publish=${{ steps.publish.outcome }}" | Add-Content artifacts/ci-result.txt

          foreach ($log in Get-ChildItem artifacts/*.log -ErrorAction SilentlyContinue | Sort-Object Name) {
            "`n===== $($log.Name) =====" | Add-Content artifacts/ci-result.txt
            Get-Content $log.FullName -Tail 120 | Add-Content artifacts/ci-result.txt
          }

      - name: Publish CI result branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'agent/native-host-ci-results';
            const path = 'native-host-ci-result.txt';
            const content = fs.readFileSync('artifacts/ci-result.txt', 'utf8');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: `Record native host CI result for ${context.sha.substring(0, 7)}`,
              content: Buffer.from(content).toString('base64'),
              sha,
            });

      - name: Fail unsuccessful validation
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            '${{ steps.configure.outcome }}',
            '${{ steps.native_build.outcome }}',
            '${{ steps.self_test.outcome }}',
            '${{ steps.memory.outcome }}',
            '${{ steps.managed_build.outcome }}',
            '${{ steps.publish.outcome }}'
          )
          if ($outcomes -contains 'failure' -or $outcomes -contains 'skipped') {
            throw "Native host validation did not complete successfully."
          }
