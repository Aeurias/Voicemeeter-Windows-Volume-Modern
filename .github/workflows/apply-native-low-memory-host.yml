name: Apply native low-memory host

on:
  pull_request:
    branches:
      - perf/native-low-memory-host

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: perf/native-low-memory-host
          fetch-depth: 0
          show-progress: false

      - name: Apply and squash implementation
        id: apply
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:RUNNER_TEMP 'apply-diagnostic.txt'
          try {
            if (-not (Test-Path .automation)) {
              Write-Host "Implementation is already applied."
              exit 0
            }

            $parts = Get-ChildItem .automation/native-low-memory-host.patch.gz.b64.part* | Sort-Object Name
            if ($parts.Count -ne 6) {
              throw "Expected 6 patch chunks, found $($parts.Count)."
            }

            $base64 = [string]::Concat(($parts | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }))
            "Base64 length: $($base64.Length)" | Set-Content $diagnostic
            "Base64 SHA256: $(([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($base64)))).ToLowerInvariant())" | Add-Content $diagnostic

            $compressed = [Convert]::FromBase64String($base64)
            [IO.File]::WriteAllBytes("native-low-memory-host.patch.gz", $compressed)
            "Compressed length: $($compressed.Length)" | Add-Content $diagnostic

            $input = [IO.File]::OpenRead("native-low-memory-host.patch.gz")
            $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            $output = [IO.File]::Create("native-low-memory-host.patch")
            try {
              $gzip.CopyTo($output)
            }
            finally {
              $output.Dispose()
              $gzip.Dispose()
              $input.Dispose()
            }

            "Patch length: $((Get-Item native-low-memory-host.patch).Length)" | Add-Content $diagnostic
            "Patch SHA256: $((Get-FileHash native-low-memory-host.patch -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content $diagnostic

            $applyOutput = & git apply --index --whitespace=error-all native-low-memory-host.patch 2>&1
            $applyOutput | Out-String | Add-Content $diagnostic
            if ($LASTEXITCODE -ne 0) {
              throw "git apply failed with exit code $LASTEXITCODE"
            }

            Remove-Item .automation -Recurse -Force
            Remove-Item native-low-memory-host.patch, native-low-memory-host.patch.gz -Force
            git add -A

            git fetch origin agent/stop-audio-endpoint-refresh-churn
            git reset --soft origin/agent/stop-audio-endpoint-refresh-churn
            git add -A
            $checkOutput = & git -c core.whitespace=cr-at-eol diff --cached --check 2>&1
            $checkOutput | Out-String | Add-Content $diagnostic
            if ($LASTEXITCODE -ne 0) {
              throw "The generated change set failed git diff --check"
            }

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Move background sync to a low-memory native host"
            git push --force-with-lease origin HEAD:perf/native-low-memory-host
          }
          catch {
            ($_ | Out-String) | Add-Content $diagnostic
            throw
          }

      - name: Upload apply diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-host-apply-diagnostic
          path: ${{ runner.temp }}/apply-diagnostic.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when application failed
        if: steps.apply.outcome == 'failure'
        shell: pwsh
        run: throw 'Native host patch application failed. See diagnostic artifact.'
